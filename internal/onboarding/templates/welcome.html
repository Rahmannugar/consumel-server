<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f7f9;color:#071018;font-family:Arial,sans-serif">
    <div style="max-width:560px;margin:0 auto;padding:40px 24px">
      <div style="background:#ffffff;border:1px solid #dce3e8;border-radius:12px;padding:32px">
        <p style="margin:0 0 12px;color:#087cec;font-size:13px;font-weight:700">CONSUMEL</p>
        <h1 style="margin:0 0 16px;font-size:28px;line-height:1.2">Welcome to Consumel</h1>
        <p style="margin:0 0 24px;color:#53616b;line-height:1.6">
          Your first project, <strong>{{.ProjectName}}</strong>, is ready in
          {{.OrganizationName}}.
        </p>
        <a href="{{.ProjectURL}}" style="display:inline-block;border-radius:8px;background:#087cec;color:#ffffff;padding:12px 18px;font-size:14px;font-weight:700;text-decoration:none">
          Open project
        </a>
      </div>
    </div>
  </body>
</html>
