{{define "email-layout"}}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>{{.Title}}</title>
    <style>
      @media only screen and (max-width: 620px) {
        .email-outer { padding: 20px 12px !important; }
        .email-brand { padding: 15px 20px !important; }
        .email-content { padding: 24px 20px 28px !important; }
        .email-footer { padding: 18px 20px !important; }
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background:#ffffff;color:#071018;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{.Preview}}&#847;&zwnj;&nbsp;&#8199;&#65279;&#847;&zwnj;&nbsp;&#8199;&#65279;</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#ffffff" style="width:100%;background:#ffffff;border-collapse:collapse;">
      <tr>
        <td class="email-outer" align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:600px;background:#ffffff;border:1px solid #e3e9ed;border-radius:12px;border-collapse:separate;border-spacing:0;overflow:hidden;">
            <tr>
              <td class="email-brand" bgcolor="#087cec" style="padding:17px 28px;background:#087cec;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;">
                  <tr>
                    <td width="32" valign="middle" style="width:32px;padding:0 4px 0 0;">
                      <img src="https://consumel.com/assets/logo.png" alt="" width="32" height="32" style="display:block;width:32px;height:32px;border:0;outline:none;text-decoration:none;object-fit:contain;" />
                    </td>
                    <td valign="middle" style="padding:0;font-size:19px;line-height:24px;font-weight:700;letter-spacing:-0.3px;color:#ffffff;">Consumel</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td class="email-content" style="padding:30px 32px 34px;color:#071018;font-size:14px;line-height:22px;">
                {{template "email-content" .}}
              </td>
            </tr>
            <tr>
              <td class="email-footer" style="padding:20px 32px;border-top:1px solid #e3e9ed;color:#71838f;font-size:12px;line-height:18px;text-align:center;">
                <p style="margin:0;">This automated inbox does not accept replies.</p>
                <p style="margin:7px 0 0;">© {{.Year}} Consumel</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>{{end}}
