{{define "email-layout"}}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>{{.Title}}</title>
    <style>
      @media only screen and (max-width: 620px) {
        .email-outer { padding: 20px 12px !important; }
        .email-brand { padding: 14px 20px !important; }
        .email-content { padding: 24px 20px 28px !important; }
        .email-footer { padding: 20px !important; }
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background:#f4f7f9;color:#071018;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{.Preview}}&#847;&zwnj;&nbsp;&#8199;&#65279;&#847;&zwnj;&nbsp;&#8199;&#65279;</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#f4f7f9" style="width:100%;background:#f4f7f9;border-collapse:collapse;">
      <tr>
        <td class="email-outer" align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:600px;background:#ffffff;border:1px solid #dce3e8;border-radius:12px;border-collapse:separate;border-spacing:0;overflow:hidden;">
            <tr>
              <td class="email-brand" style="padding:16px 24px;border-bottom:1px solid #dce3e8;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;">
                  <tr>
                    <td width="40" valign="middle" style="width:40px;padding:0 8px 0 0;">
                      <img src="https://consumel.com/assets/logo.png" alt="" width="36" height="36" style="display:block;width:36px;height:36px;border:0;outline:none;text-decoration:none;object-fit:contain;" />
                    </td>
                    <td valign="middle" style="padding:0;font-size:19px;line-height:24px;font-weight:700;letter-spacing:-0.25px;color:#071018;">Consumel</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td class="email-content" style="padding:28px 32px 34px;color:#071018;font-size:14px;line-height:22px;">
                {{template "email-content" .}}
              </td>
            </tr>
            <tr>
              <td class="email-footer" style="padding:24px 32px;border-top:1px solid #dce3e8;color:#71838f;font-size:12px;line-height:18px;text-align:center;">
                <p style="margin:0;">You’re receiving this email because of activity associated with your email address on Consumel.</p>
                <p style="margin:6px 0 0;">This is an automated message. Replies to this inbox are not monitored.</p>
                <p style="margin:10px 0 0;">© {{.Year}} Consumel</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>{{end}}
