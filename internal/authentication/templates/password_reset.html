{{define "email-content"}}
<h1 style="margin:0 0 10px;font-size:24px;line-height:30px;letter-spacing:-0.45px;color:#071018;font-weight:650;">Reset your password</h1>
<p style="margin:0 0 24px;color:#536774;font-size:14px;line-height:22px;">Use the secure link below to choose a new password for your Consumel account.</p>
<table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:0 0 22px;border-collapse:collapse;">
  <tr>
    <td bgcolor="#087cec" style="border-radius:8px;background:#087cec;">
      <a href="{{.ResetURL}}" style="display:inline-block;padding:12px 18px;color:#ffffff;font-size:14px;line-height:20px;font-weight:650;text-decoration:none;">Reset password</a>
    </td>
  </tr>
</table>
<p style="margin:0;color:#6b7882;font-size:13px;line-height:20px;">This link expires in {{.ExpiresIn}} and can be used once. If you didn’t request a password reset, you can safely ignore this email.</p>
{{end}}
