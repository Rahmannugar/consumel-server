{{define "email-content"}}
<h1 style="margin:0 0 10px;font-size:24px;line-height:30px;letter-spacing:-0.45px;color:#071018;font-weight:650;">Verify your email</h1>
<p style="margin:0 0 24px;color:#536774;font-size:14px;line-height:22px;">Use the code below to verify your email address.</p>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;margin:0 0 22px;border-collapse:collapse;border-top:1px solid #dce3e8;border-bottom:1px solid #dce3e8;">
  <tr>
    <td align="center" style="padding:23px 16px;color:#071018;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:30px;line-height:38px;letter-spacing:7px;font-weight:700;">{{.Code}}</td>
  </tr>
</table>
<p style="margin:0;color:#6b7882;font-size:13px;line-height:20px;">This code expires in {{.ExpiresIn}}. If you didn’t request it, you can safely ignore this email.</p>
{{end}}
