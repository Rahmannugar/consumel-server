[database]
host = {{ env "CONSUMEL_DATABASE_HOST" }}
port = {{ env "CONSUMEL_DATABASE_PORT" }}
database = {{ env "CONSUMEL_DATABASE_NAME" }}
user = {{ env "CONSUMEL_DATABASE_USER" }}
password = {{ env "CONSUMEL_DATABASE_PASSWORD" }}
sslmode = {{ env "CONSUMEL_DATABASE_SSL_MODE" }}
version_table = public.schema_version
