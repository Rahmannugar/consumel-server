name: CI

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Format, test, vet, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify generated database code
        run: |
          go tool sqlc generate
          git diff --exit-code -- internal/users/repositories/generated internal/organizations/repositories/generated internal/projects/repositories/generated

      - name: Test
        run: go test ./...

      - name: Test database integration
        run: go test -p 1 -tags=integration ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...
