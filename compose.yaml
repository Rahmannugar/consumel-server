name: consumel-server

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: consumel
      POSTGRES_USER: consumel
      POSTGRES_PASSWORD: consumel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=consumel --dbname=consumel"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    image: consumel-server-local
    profiles:
      - tools
    command:
      - go
      - tool
      - tern
      - migrate
      - --config
      - internal/infra/database/tern.conf
      - --migrations
      - internal/infra/database/migrations
    environment:
      CONSUMEL_DATABASE_URL: postgres://consumel:consumel@postgres:5432/consumel?sslmode=disable
    volumes:
      - .:/workspace
      - go-modules:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: consumel-server-local
    build:
      context: .
    env_file:
      - .env
    environment:
      CONSUMEL_DATABASE_URL: postgres://consumel:consumel@postgres:5432/consumel?sslmode=disable
      CONSUMEL_REDIS_URL: redis://redis:6379/0
      CONSUMEL_AUTH_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - go-modules:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3m
    init: true
    stop_grace_period: 20s

volumes:
  postgres-data:
  redis-data:
  go-modules:
  go-build-cache:
